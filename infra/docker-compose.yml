services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: atlasops-postgres
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atlasops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlasops_local}
      POSTGRES_DB: ${POSTGRES_DB:-atlasops}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - atlasops-pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
      - ./seed:/seed:ro
    networks:
      - atlasops-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-atlasops} -d ${POSTGRES_DB:-atlasops}",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: atlasops-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - atlasops-redisdata:/data
    networks:
      - atlasops-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2024-01-01T16-36-33Z
    container_name: atlasops-minio
    env_file:
      - ../.env
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - atlasops-miniodata:/data
    networks:
      - atlasops-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama:
    image: ollama/ollama:0.3.4
    container_name: atlasops-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - atlasops-ollamadata:/root/.ollama
    networks:
      - atlasops-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 12

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: atlasops-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - atlasops-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 12

  grafana:
    image: grafana/grafana:10.2.0
    container_name: atlasops-grafana
    env_file:
      - ../.env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - atlasops-grafanadata:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - atlasops-network
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  loki:
    image: grafana/loki:2.9.0
    container_name: atlasops-loki
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/loki-config.yml:ro
    networks:
      - atlasops-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: atlasops-mailhog
    ports:
      - "${MAILHOG_PORT:-8025}:8025"
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
    networks:
      - atlasops-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025"]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  atlasops-network:
    driver: bridge
    name: atlasops-network

volumes:
  atlasops-pgdata:
    name: atlasops-pgdata
  atlasops-redisdata:
    name: atlasops-redisdata
  atlasops-miniodata:
    name: atlasops-miniodata
  atlasops-ollamadata:
    name: atlasops-ollamadata
  atlasops-grafanadata:
    name: atlasops-grafanadata
