server:
  port: ${APP_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: atlasops-api

  profiles:
    active: ${APP_ENV:local}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/atlasops}
    username: ${POSTGRES_USER:atlasops}
    password: ${POSTGRES_PASSWORD:atlasops_local}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: atlasops-hikari
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 30000
      validation-timeout: 5000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 5000ms
        shutdown-timeout: 2000ms

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    jwt:
      issuer: ${JWT_ISSUER:atlasops-local}
      audience: ${JWT_AUDIENCE:atlasops-api}
      secret: ${JWT_SECRET:local-dev-secret-min-32-chars-long}
      expiration: 3600

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    group:
      readiness:
        include: readinessState,db,redis,minio
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
    tags:
      application: atlasops-ai

# MinIO / S3 configuration
app:
  storage:
    endpoint: ${OBJECT_STORAGE_ENDPOINT:http://localhost:9000}
    bucket: ${OBJECT_STORAGE_BUCKET:atlasops-local}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    region: ${OBJECT_STORAGE_REGION:us-east-1}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.atlasops: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
