server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:atlasops_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  data:
    redis:
      url: redis://localhost:6379
      lettuce:
        pool:
          max-active: 4
          max-idle: 2
          min-idle: 0

  flyway:
    enabled: false

  security:
    jwt:
      issuer: atlasops-test
      audience: atlasops-api-test
      secret: test-secret-key-min-32-chars-long-value
      expiration: 300

app:
  storage:
    endpoint: http://localhost:9000
    bucket: atlasops-test
    access-key: minioadmin
    secret-key: minioadmin
    region: us-east-1

logging:
  level:
    root: WARN
    com.atlasops: INFO
