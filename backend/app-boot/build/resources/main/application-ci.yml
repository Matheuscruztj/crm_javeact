spring:
  datasource:
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    properties:
      hibernate:
        format_sql: false
    show-sql: false

  data:
    redis:
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1
          max-wait: 3000ms

logging:
  level:
    root: WARN
    com.atlasops: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

management:
  endpoint:
    health:
      show-details: never
