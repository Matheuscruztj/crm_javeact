# ============================================================
# AtlasOps AI - Centralized Dependency Versions
# ============================================================

# Project
group=com.atlasops
version=0.1.0-SNAPSHOT

# Java
javaVersion=21

# ============================================================
# Gradle Performance Optimizations
# ============================================================
# Enable parallel project execution (builds independent modules simultaneously)
org.gradle.parallel=true

# Enable build caching (reuses outputs from previous builds)
org.gradle.caching=true

# Enable configuration caching (caches configuration phase)
org.gradle.configuration-cache=true

# Configure JVM for optimal performance
# - Xmx4g: Increase heap for large multi-module builds
# - XX:+UseG1GC: Use G1 garbage collector (better for large heaps)
# - XX:+HeapDumpOnOutOfMemoryError: Diagnose OOM issues
# - XX:MaxMetaspaceSize: Prevent metaspace OOM
org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable file system watching (reduces scan time)
org.gradle.vfs.watch=true

# Enable daemon (background process for faster subsequent builds)
org.gradle.daemon=true

# Daemon idle timeout (15 minutes)
org.gradle.daemon.idletimeout=900000

# Number of parallel workers (auto-detect CPUs)
# org.gradle.workers.max=8

# Enable incremental compilation
org.gradle.incremental=true

# Enable continuous build mode support
org.gradle.continuous=true

# Optimize dependency resolution
org.gradle.dependency.verification=off

# Spring Boot & Framework
springBootVersion=3.5.16
springDependencyManagementVersion=1.1.4
springFrameworkVersion=6.2.19

# Spring AI
springAiVersion=1.0.0-M1
springAiOllamaVersion=1.0.0-M1
springAiPgvectorVersion=1.0.0-M1

# Testing
junitVersion=5.10.2
mockitoVersion=5.11.0
jqwikVersion=1.8.4
archunitVersion=1.2.1
assertjVersion=3.25.3
testcontainersVersion=1.19.7

# Observability
micrometerVersion=1.12.5

# Database
postgresqlDriverVersion=42.7.11
hikariVersion=5.1.0
flywayVersion=10.11.0

# Redis
lettuceVersion=6.3.2.RELEASE

# AWS S3 (MinIO)
awsSdkVersion=2.25.16

# Security
jjwtVersion=0.12.5

# Code Quality Plugins
spotlessVersion=6.25.0
spotbugsVersion=6.0.9
owaspDependencyCheckVersion=9.1.0
jacocoVersion=0.8.12
checkstyleVersion=10.14.2
