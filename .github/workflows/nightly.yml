name: Nightly Comprehensive Validation

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "24"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  DATABASE_URL: jdbc:postgresql://localhost:5432/atlasops
  POSTGRES_USER: atlasops
  POSTGRES_PASSWORD: atlasops_ci
  REDIS_URL: redis://localhost:6379

jobs:
  full-load-test:
    name: Full Load Test
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Start backend stack for load test
        run: docker compose up -d postgres redis minio backend-api

      - name: Wait for backend API readiness
        run: |
          for i in {1..36}; do
            if curl -fsS http://localhost:8080/actuator/health/readiness >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          docker compose ps
          docker compose logs backend-api
          exit 1

      - name: Install k6
        run: |
          curl https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz -L | tar xvz --strip-components 1
          sudo mv k6 /usr/local/bin/k6
          k6 version

      - name: Run average load test
        run: |
          mkdir -p k6-results
          k6 run --summary-export=k6-results/average.summary.json --out json=k6-results/average.json tests/load/average.js

      - name: Generate HTML report
        run: node tests/load/generate-report.mjs k6-results/average.summary.json k6-results/average.json k6-results/average.html

      - name: Upload k6 results artifact
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-results-${{ github.run_number }}
          path: k6-results/
          retention-days: 14

      - name: Dump backend logs on failure
        if: failure()
        run: docker compose logs backend-api postgres redis minio

      - name: Stop backend stack
        if: always()
        run: docker compose down -v

  architecture-scan:
    name: Architecture Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: "gradle"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run backend architecture tests
        run: ./gradlew :backend:app-boot:architectureTest --no-daemon

      - name: Run frontend architecture tests
        working-directory: frontend
        run: pnpm architecture:check

      - name: Upload architecture test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecture-test-results-${{ github.run_number }}
          path: "**/build/reports/tests/**"
          retention-days: 14

  dependency-report:
    name: Dependency Report
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Run OWASP dependency check
        run: ./gradlew dependencyCheckAnalyze --no-daemon

      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-report-${{ github.run_number }}
          path: "**/build/reports/dependency-check*"
          retention-days: 30

  trivy-security-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy --version

      - name: Build backend images
        run: |
          docker build -t atlasops/backend-api:latest -f backend/app-boot/Dockerfile .
          docker build -t atlasops/worker:latest -f backend/worker/Dockerfile .

      - name: Run Trivy security scans
        run: make verify-security

  flaky-test-detection:
    name: Flaky Test Detection
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: atlasops
          POSTGRES_PASSWORD: atlasops_ci
          POSTGRES_DB: atlasops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlasops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Run unit tests (attempt 1)
        id: run1
        run: ./gradlew test --no-daemon 2>&1 | tee test-run-1.log
        continue-on-error: true

      - name: Run unit tests (attempt 2)
        id: run2
        run: ./gradlew test --no-daemon 2>&1 | tee test-run-2.log
        continue-on-error: true

      - name: Run unit tests (attempt 3)
        id: run3
        run: ./gradlew test --no-daemon 2>&1 | tee test-run-3.log
        continue-on-error: true

      - name: Report flaky tests
        run: |
          echo "=== Test Run Results ==="
          echo "Run 1: ${{ steps.run1.outcome }}"
          echo "Run 2: ${{ steps.run2.outcome }}"
          echo "Run 3: ${{ steps.run3.outcome }}"
          if [[ "${{ steps.run1.outcome }}" == "failure" && "${{ steps.run2.outcome }}" == "failure" && "${{ steps.run3.outcome }}" == "failure" ]]; then
            echo "All attempts failed consistently. This is a deterministic failure, not just flakiness."
            exit 1
          fi
          if [[ "${{ steps.run1.outcome }}" != "${{ steps.run2.outcome }}" ]] || \
             [[ "${{ steps.run2.outcome }}" != "${{ steps.run3.outcome }}" ]]; then
            echo "Inconsistent test results detected. Possible flaky tests."
            exit 1
          fi
          echo "All runs passed consistently."

      - name: Upload test logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flaky-test-logs-${{ github.run_number }}
          path: "test-run-*.log"
          retention-days: 7

  mutation-testing:
    name: Mutation Testing (PIT)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: ${{ vars.PITEST_ENABLED == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Run mutation tests
        run: ./gradlew pitest --no-daemon

  sbom:
    name: SBOM Generation (Syft)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM with Syft
        run: |
          syft . --output cyclonedx-json=sbom.json
          echo "SBOM generated with $(cat sbom.json | python3 -c 'import sys,json; d=json.load(sys.stdin); print(len(d.get(\"components\",[])))' 2>/dev/null || echo "?") components"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.json
          retention-days: 90
