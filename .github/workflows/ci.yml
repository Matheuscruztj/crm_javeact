name: CI - Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "24"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"
  DATABASE_URL: jdbc:postgresql://localhost:5432/atlasops
  POSTGRES_USER: atlasops
  POSTGRES_PASSWORD: atlasops_ci
  REDIS_URL: redis://localhost:6379

jobs:
  backend-fast:
    name: Backend Fast Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: atlasops
          POSTGRES_PASSWORD: atlasops_ci
          POSTGRES_DB: atlasops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlasops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "gradle"

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Fast verification
        run: ./gradlew verifyFast

      - name: Upload fast test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-fast-test-results
          path: "**/build/reports/tests/"
          retention-days: 7

  backend-static-analysis:
    name: Backend Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "gradle"

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Checkstyle and SpotBugs
        run: ./gradlew checkstyleMain spotbugsMain

      - name: Upload static analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-static-analysis-reports
          path: |
            **/build/reports/checkstyle/
            **/build/reports/spotbugs/
          retention-days: 7

  backend-sast:
    name: Backend SAST
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "gradle"

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Run Semgrep SAST
        run: ./scripts/quality/semgrep.sh

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-semgrep-report
          path: build/reports/semgrep/semgrep.sarif
          retention-days: 7

  backend-property-tests:
    name: Backend Property Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: atlasops
          POSTGRES_PASSWORD: atlasops_ci
          POSTGRES_DB: atlasops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlasops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "gradle"

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Run property tests
        run: ./gradlew testProperty

      - name: Upload property test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-property-test-results
          path: "**/build/reports/tests/"
          retention-days: 7

  backend-architecture:
    name: Backend Architecture
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "gradle"

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Architecture tests (Backend)
        run: ./gradlew :backend:app-boot:architectureTest

  backend-coverage:
    name: Backend Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: atlasops
          POSTGRES_PASSWORD: atlasops_ci
          POSTGRES_DB: atlasops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlasops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "gradle"

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Unit tests with coverage
        run: ./gradlew test jacocoTestReport aggregateJacocoReport jacocoTestCoverageVerification

      - name: Build packages
        run: ./gradlew build -x test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            **/build/reports/jacoco/
            build/reports/jacoco/aggregated/
          retention-days: 7

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-test-results
          path: "**/build/reports/tests/"
          retention-days: 7

  frontend-fast:
    name: Frontend Fast Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend fast verification
        working-directory: frontend
        run: pnpm verify:fast

  frontend-unit-coverage:
    name: Frontend Unit Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend unit coverage
        working-directory: frontend
        run: pnpm test:unit:coverage

      - name: Upload frontend coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-unit-coverage
          path: |
            frontend/coverage/
          retention-days: 7

  architecture-frontend:
    name: Frontend Architecture
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Architecture tests (Frontend)
        working-directory: frontend
        run: pnpm architecture:check

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: atlasops
          POSTGRES_PASSWORD: atlasops_ci
          POSTGRES_DB: atlasops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlasops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "gradle"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Verify contracts
        run: make verify-contracts

      - name: Upload OpenAPI artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-contract
          path: backend/app-boot/build/reports/openapi/openapi.json
          retention-days: 7

  resilience-tests:
    name: Resilience Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: atlasops
          POSTGRES_PASSWORD: atlasops_ci
          POSTGRES_DB: atlasops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlasops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "gradle"

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Run resilience tests
        run: ./gradlew :backend:app-boot:resilienceTest
