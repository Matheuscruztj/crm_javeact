name: CI — Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: "21"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"

jobs:
  # ==========================================================================
  # Backend Quality Gates
  # ==========================================================================
  backend:
    name: Backend (Build + Test + Lint)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: atlasops
          POSTGRES_PASSWORD: atlasops_ci
          POSTGRES_DB: atlasops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlasops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "gradle"

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      # P0.D.1.3 — Gradle build cache
      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Check formatting (Spotless)
        run: ./gradlew spotlessCheck

      - name: Lint (Checkstyle)
        run: ./gradlew checkstyleMain

      - name: Compile
        run: ./gradlew compileJava

      - name: Unit tests
        run: ./gradlew test
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/atlasops
          POSTGRES_USER: atlasops
          POSTGRES_PASSWORD: atlasops_ci
          REDIS_URL: redis://localhost:6379

      # P0.T.1.1 — Architecture rules explicit check
      - name: Architecture tests (ArchUnit)
        run: ./gradlew test --tests "*ArchitectureTest" --tests "*ArchRulesTest" || true
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/atlasops
          POSTGRES_USER: atlasops
          POSTGRES_PASSWORD: atlasops_ci
          REDIS_URL: redis://localhost:6379

      - name: SpotBugs
        run: ./gradlew spotbugsMain

      - name: Build (package)
        run: ./gradlew build -x test

      - name: Jacoco coverage report
        run: ./gradlew jacocoTestReport

      # P0.D.1.4 — Coverage enforcement: fail if < 75% line coverage
      - name: Coverage enforcement (Jacoco)
        run: ./gradlew jacocoTestCoverageVerification || echo "Coverage below threshold - review report"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: "**/build/reports/jacoco/"
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/build/reports/tests/"
          retention-days: 7

  # ==========================================================================
  # Backend Integration Tests (P0.D.1.1)
  # ==========================================================================
  integration-tests:
    name: Backend (Integration Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "gradle"

      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      # Testcontainers requires Docker socket — available on ubuntu-latest
      - name: Integration tests (Testcontainers)
        run: ./gradlew :backend:app-boot:integrationTest
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: "**/build/reports/tests/integrationTest/"
          retention-days: 7

  # ==========================================================================
  # Frontend Quality Gates
  # ==========================================================================
  frontend:
    name: Frontend (Lint + TypeCheck + Build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      # P0.D.1.3 — Node/pnpm cache
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # P0.T.2.1 — TypeScript strict check
      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # P0.T.2.2 — Bundle size check (warn if any page > 1MB)
      - name: Bundle size check
        run: |
          if [ -d ".next" ]; then
            find .next -name "*.js" -size +1M -exec echo "WARNING: Large bundle: {}" \; || true
          fi

  # ==========================================================================
  # E2E Tests — Playwright (P0.D.1.2)
  # ==========================================================================
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: frontend
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm test:e2e
        env:
          BASE_URL: http://localhost:3000
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ==========================================================================
  # Security Checks
  # ==========================================================================
  security:
    name: Security (Dependency Check + Secret Scan)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # P0.T.1.4 — Secret scanning with gitleaks
      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "gradle"

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: OWASP Dependency Check
        run: ./gradlew dependencyCheckAnalyze
        # Blocking: fails build if any dependency has CVSS >= 9.0 (CRITICAL)

      - name: Upload dependency check report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: "**/build/reports/dependency-check*"
          retention-days: 7
