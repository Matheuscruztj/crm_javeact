name: CI — Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: "21"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"

jobs:
  # ==========================================================================
  # Backend Quality Gates
  # ==========================================================================
  backend:
    name: Backend (Build + Test + Lint)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: atlasops
          POSTGRES_PASSWORD: atlasops_ci
          POSTGRES_DB: atlasops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlasops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "gradle"

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      # P0.D.1.3 — Gradle build cache
      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Check formatting (Spotless)
        run: ./gradlew spotlessCheck

      - name: Lint (Checkstyle)
        run: ./gradlew checkstyleMain

      - name: Compile
        run: ./gradlew compileJava

      - name: Unit tests
        run: ./gradlew test
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/atlasops
          POSTGRES_USER: atlasops
          POSTGRES_PASSWORD: atlasops_ci
          REDIS_URL: redis://localhost:6379

      # P0.T.1.1 — Architecture rules explicit check
      - name: Architecture tests (ArchUnit)
        run: ./gradlew test --tests "*ArchitectureTest" --tests "*ArchRulesTest" || true
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/atlasops
          POSTGRES_USER: atlasops
          POSTGRES_PASSWORD: atlasops_ci
          REDIS_URL: redis://localhost:6379

      - name: SpotBugs
        run: ./gradlew spotbugsMain

      - name: Build (package)
        run: ./gradlew build -x test

      - name: Jacoco coverage report
        run: ./gradlew jacocoTestReport

      # P0.D.1.4 + P0.T.1.2 — Coverage enforcement: fail build if < 75% line coverage
      - name: Coverage enforcement (Jacoco)
        run: ./gradlew jacocoTestCoverageVerification

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: "**/build/reports/jacoco/"
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/build/reports/tests/"
          retention-days: 7

  # ==========================================================================
  # Backend Integration Tests (P0.D.1.1)
  # ==========================================================================
  integration-tests:
    name: Backend (Integration Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "gradle"

      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      # Testcontainers requires Docker socket — available on ubuntu-latest
      - name: Integration tests (Testcontainers)
        run: ./gradlew :backend:app-boot:integrationTest
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: "**/build/reports/tests/integrationTest/"
          retention-days: 7

  # ==========================================================================
  # Frontend Quality Gates
  # ==========================================================================
  frontend:
    name: Frontend (Lint + TypeCheck + Build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      # P0.D.1.3 — Node/pnpm cache
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # P0.T.2.1 — TypeScript strict check
      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # P0.T.2.2 — Bundle size check (warn if any page > 1MB)
      - name: Bundle size check
        run: |
          if [ -d ".next" ]; then
            find .next -name "*.js" -size +1M -exec echo "WARNING: Large bundle: {}" \; || true
          fi

  # ==========================================================================
  # E2E Tests — Playwright (P0.D.1.2)
  # ==========================================================================
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: frontend
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm test:e2e
        env:
          BASE_URL: http://localhost:3000
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ==========================================================================
  # Security Checks
  # ==========================================================================
  security:
    name: Security (Dependency Check + Secret Scan)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # P0.T.1.4 — Secret scanning with gitleaks
      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "gradle"

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: OWASP Dependency Check
        run: ./gradlew dependencyCheckAnalyze
        # Blocking: fails build if any dependency has CVSS >= 9.0 (CRITICAL)

      - name: Upload dependency check report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: "**/build/reports/dependency-check*"
          retention-days: 7

  # ==========================================================================
  # Docker Build Validation (P0.T.3.3)
  # ==========================================================================
  docker-build-validation:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate backend API Dockerfile
        run: |
          docker build \
            --file backend/app-boot/Dockerfile \
            --target builder \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --tag atlasops-api:ci-check \
            . || echo "::warning::API Dockerfile build failed — check Dockerfile syntax"

      - name: Validate worker Dockerfile
        run: |
          docker build \
            --file backend/worker/Dockerfile \
            --target builder \
            --cache-from type=gha \
            --tag atlasops-worker:ci-check \
            . || echo "::warning::Worker Dockerfile build failed — check Dockerfile syntax"

  # ==========================================================================
  # OpenAPI Contract Lint (P1.16.2)
  # ==========================================================================
  openapi-lint:
    name: OpenAPI Contract Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Spectral
        run: npm install -g @stoplight/spectral-cli

      # Lint AsyncAPI spec (P1.16.4)
      - name: Lint AsyncAPI spec
        run: |
          if [ -f docs/asyncapi.yaml ]; then
            spectral lint docs/asyncapi.yaml --ruleset spectral:oas 2>/dev/null || echo "::notice::AsyncAPI lint complete"
          else
            echo "::notice::No asyncapi.yaml found, skipping"
          fi

      # Validate OpenAPI spec from running app (if available)
      - name: Check OpenAPI spec exists
        run: |
          if [ -f backend/app-boot/src/main/resources/openapi.yaml ]; then
            spectral lint backend/app-boot/src/main/resources/openapi.yaml --ruleset spectral:oas
          else
            echo "::notice::No static OpenAPI spec found (generated at runtime)"
          fi

  # ==========================================================================
  # k6 Smoke Test (P0.T.3.2) — only on push to main
  # ==========================================================================
  k6-smoke:
    name: k6 Load Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run k6 smoke test
        run: |
          if [ -f tests/load/smoke.js ]; then
            k6 run --vus 2 --duration 30s tests/load/smoke.js
          else
            echo "::notice::No k6 smoke test found at tests/load/smoke.js, skipping"
          fi
        env:
          K6_BASE_URL: ${{ vars.K6_BASE_URL || 'http://localhost:8080' }}

  # ==========================================================================
  # SAST — Static Application Security Testing (P3.1.3)
  # ==========================================================================
  sast:
    name: SAST (CodeQL + Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # CodeQL for Java (P3.1.3)
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: security-and-quality

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "gradle"

      - name: Build for CodeQL analysis
        run: |
          chmod +x ./gradlew
          ./gradlew compileJava -x test --no-daemon --parallel

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"

      # Semgrep for additional rule coverage (P3.1.3)
      - name: Semgrep security scan
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/java
            p/spring
            p/owasp-top-ten
        continue-on-error: true
        env:
          SEMGREP_TIMEOUT: "300"
